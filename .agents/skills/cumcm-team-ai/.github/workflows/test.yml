name: Skill regression tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q scripts templates/shared/code_starter
      - run: python scripts/doctor.py --competition cumcm --skip-tools
      - run: python scripts/doctor.py --competition mcm --skip-tools
      - run: python scripts/doctor.py --competition diangong --skip-tools
